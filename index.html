<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1336">
<title>ถึง ริน · คืนวันลอยกระทง</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== สีธีม (แก้ที่นี่ที่เดียว) ===== */
:root{
  color-scheme:dark;
  --sky1:#0b1336;--sky2:#1c2565;--sky3:#4b3a7c;--glow:#d9773f;
  --card:rgba(24,24,64,.88);--ink:#fff4dc;--sub:#e0d8f2;
  --accent:#ffb347;--accent-ink:#3a1d00;--pill:#2f3680;--heart:#ff8fa8;
  --shadow:rgba(3,6,28,.55);
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;min-height:100dvh;font-family:"Mali","Sarabun","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.6) 1px,transparent 1.6px) 0 0/97px 97px,
    radial-gradient(circle at 1px 1px,rgba(255,226,160,.45) 1px,transparent 1.6px) 41px 53px/137px 137px,
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 52%,var(--sky3) 78%,var(--glow) 100%);
  background-color:var(--sky1);background-attachment:fixed;
  display:grid;place-items:center;overflow-x:hidden;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}

/* ===== ฉากหลัง ===== */
.moon{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4vh);right:8vw;width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fffbe8,#ffe9a6 70%,#f3cf74);
  box-shadow:0 0 0 12px rgba(255,233,166,.08),0 0 60px 18px rgba(255,233,166,.3);z-index:0;pointer-events:none;animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 16px rgba(255,233,166,.1),0 0 80px 26px rgba(255,233,166,.38)}}
.river{position:fixed;left:0;right:0;bottom:0;height:22vh;min-height:120px;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(ellipse 60px 9px at 30px 14px,rgba(255,255,255,.13) 98%,transparent) 0 0/120px 34px repeat-x,linear-gradient(180deg,transparent,rgba(8,12,40,.55))}
.kt{position:absolute;bottom:14px;left:-80px;width:64px;height:auto;filter:drop-shadow(0 0 12px rgba(255,190,80,.75));animation:drift 36s linear infinite,bob 3.4s ease-in-out infinite}
.kt:nth-child(1){animation-delay:-8s,0s}
.kt:nth-child(2){width:48px;bottom:36px;animation-duration:48s,4.2s;animation-delay:-28s,-1s}
.kt:nth-child(3){width:56px;bottom:6px;animation-duration:42s,3.8s;animation-delay:-18s,-2s}
@keyframes drift{to{transform:translateX(calc(100vw + 160px))}}
@keyframes bob{0%,100%{margin-bottom:0}50%{margin-bottom:5px}}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sp{position:absolute;width:7px;height:7px;background:#fff6d6;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.hrt{position:absolute;bottom:-30px;color:var(--heart);opacity:0;animation:up linear forwards}
@keyframes up{0%{opacity:0;transform:translate(0,0)}15%{opacity:.7}100%{opacity:0;transform:translate(var(--dx),-105vh)}}

/* ===== การ์ด ===== */
.card{position:relative;z-index:2;width:min(100%,430px);background:var(--card);border-radius:40px 40px 28px 28px;
  padding:30px 20px 26px;text-align:center;outline:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:-10px;
  box-shadow:0 18px 50px var(--shadow),0 0 70px rgba(255,179,71,.14);backdrop-filter:blur(8px)}
section{animation:pg .7s ease both}
@keyframes pg{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pill{display:inline-block;background:var(--pill);color:var(--sub);font-size:13px;padding:5px 14px;border-radius:10px 10px 10px 2px;font-weight:600}
h1{font-size:25px;line-height:1.45;margin:14px 0 10px;font-weight:700;color:var(--ink)}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 30%,transparent) 62%)}
p{margin:6px 0;line-height:1.8;color:var(--sub);font-size:15px}
.note{margin-top:12px;font-size:12.5px;color:var(--sub);opacity:.8}
.sign{margin-top:14px;text-align:right;color:var(--accent);font-weight:600;font-size:15px}

/* กระทงเล็กหน้าจดหมาย */
.ktm{width:76px;margin:16px auto 0;filter:drop-shadow(0 0 14px rgba(255,190,80,.75));animation:bob2 3.4s ease-in-out infinite}
.ktm svg{display:block;width:100%;height:auto}
@keyframes bob2{50%{transform:translateY(-5px)}}

/* จดหมาย */
.paper{margin:16px 0 4px;padding:18px 16px;text-align:left;border-radius:20px;background:rgba(255,244,220,.07);border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent)}
.paper .to{color:var(--accent);font-weight:700;margin:0 0 6px}
.paper p{color:var(--ink);font-size:14.5px;line-height:1.95;opacity:0;animation:pg .9s ease forwards}
.paper p.last{color:var(--accent);font-weight:600}
.later{opacity:0;animation:pg .9s ease forwards}

/* ปุ่ม */
.actions{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:22px}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:13px 24px;font-size:16px;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--heart);outline-offset:3px}
.yes{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 24px rgba(255,179,71,.4);transition:transform .2s}
.yes:active{transform:scale(.96)}
.alt{background:var(--pill);color:var(--sub);font-size:14px}
.date{margin-top:16px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.pic{display:grid;place-items:center;margin:16px 0 4px}
.pic img{max-height:150px;max-width:62%;width:auto;height:auto;display:block;background:#fff4e2;border-radius:30px;padding:6px;box-shadow:0 0 28px rgba(255,190,90,.35)}
.ico{font-size:44px;line-height:1;margin-top:10px;filter:drop-shadow(0 0 16px rgba(255,190,80,.7))}

/* ปุ่มเพลง */
#mus{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;width:42px;height:42px;padding:0;font-size:18px;background:var(--pill);color:var(--ink);opacity:.9}
.pop{position:fixed;pointer-events:none;font-size:22px;color:var(--heart);animation:rise 1.8s ease-out forwards;z-index:5}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-180px) scale(1.3)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}.paper p,.later{opacity:1}.hrt,.pop{display:none}.kt{left:12%}.kt:nth-child(2){left:44%}.kt:nth-child(3){left:76%}
}
</style>
</head>

<div class="moon" aria-hidden="true"></div>

  <svg class="kt" viewBox="0 0 100 84"><use href="#krathong"/></svg>
  <svg class="kt" viewBox="0 0 100 84"><use href="#krathong"/></svg>
  <svg class="kt" viewBox="0 0 100 84"><use href="#krathong"/></svg>
</div>
<button id="mus" aria-label="เปิด/ปิดเพลง" title="เปิด/ปิดเพลง">♪</button>

<main class="card" id="card">
  <section id="s1"></section>
  <section id="s2" hidden></section>

    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);
  }
  function sched(){
    while(nextT<AC.currentTime+.8){
      var c=prog[(step>>3)%prog.length],k=step%8;
      note(c[PAT[k]],nextT,2.2,.17);
      if(k==0)note(c[0]/2,nextT,3.8,.22);
      if(k==4&&((step>>3)%2==0))note(c[3]*2,nextT,2.6,.07);
      step++;nextT+=.5;
    }
  }
  function startMusic(){
    try{
      if(!AC){
        AC=new(window.AudioContext||window.webkitAudioContext)();
        master=AC.createGain();master.gain.value=.5;
        var d=AC.createDelay(),fb=AC.createGain();d.delayTime.value=.37;fb.gain.value=.35;
        master.connect(AC.destination);master.connect(d);d.connect(fb);fb.connect(d);d.connect(AC.destination);
        nextT=AC.currentTime+.1;timer=setInterval(sched,200);
      }
      AC.resume();on=true;
    }catch(e){on=false}
    upd();
  }
  function stopMusic(){try{AC&&AC.suspend()}catch(e){}on=false;upd()}
  function upd(){$("mus").textContent=on?"♪":"×";$("mus").style.opacity=on?".9":".6"}
  $("mus").addEventListener("click",function(){on?stopMusic():startMusic()});
  upd();$("mus").textContent="♪";
  document.addEventListener("visibilitychange",function(){
    if(!AC||!on)return;
    try{document.hidden?AC.suspend():AC.resume()}catch(e){}
  });
})();
</script>
